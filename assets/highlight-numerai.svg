<svg viewBox="0 0 432 278" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
  <style>
    :root { --bg1:#FFFFFF; --bg2:#F1F1F1; --line:#E4E4E4; --ink:#0A0A0A; --ink2:#3A3A3A; --mute:#8A8A8A; --mono:#6A6A6A; --shadow:#000000; --edge:#FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root { --bg1:#131316; --bg2:#08080A; --line:#2B2B30; --ink:#FFFFFF; --ink2:#D0D0D0; --mute:#8E8E93; --mono:#A0A0A6; --shadow:#5A5A5A; --edge:#F2F2F2; }
    }
    .ink { fill: var(--ink) } .ink2 { fill: var(--ink2) } .mute { fill: var(--mute) }
    .b { font-weight: 700; fill: var(--ink) }
    .mono { font-family: 'SF Mono','JetBrains Mono',Menlo,Consolas,monospace; }
    .cap { font-size: 10.5px; letter-spacing: 3px; fill: var(--mute) }
    .hair { stroke: var(--line) } .edge { stroke: var(--edge); stroke-width: 1.3; stroke-linejoin: round }
    .up { opacity: 0; transform: translateY(8px); animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes up { to { opacity: 1; transform: none } }
    .rule { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 44; stroke-dashoffset: 44; animation: draw .8s ease-out .6s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .nudge { animation: nudge 2.4s ease-in-out infinite; } @keyframes nudge { 50% { transform: translate(3px,-3px) } }
    @media (prefers-reduced-motion: reduce) {
      .up,.rule,.spine { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--bg1)"/><stop offset="1" style="stop-color:var(--bg2)"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop offset="0" style="stop-color:var(--shadow)" stop-opacity=".28"/>
      <stop offset=".6" style="stop-color:var(--shadow)" stop-opacity=".07"/>
      <stop offset="1" style="stop-color:var(--shadow)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x=".5" y=".5" width="431" height="277" rx="22" fill="url(#card)" class="hair"/>
  <g class="up" style="animation-delay:0.15s">
