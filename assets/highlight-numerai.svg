  </g>
  <text class="up ink" style="animation-delay:0.30s" x="30" y="112" font-size="50" font-weight="300" letter-spacing="-1.5">Top 20</text>
  <path class="rule" d="M32 134 H76"/>
  <g class="up" style="animation-delay:0.50s">
    <text x="32" y="164" class="b" font-size="14.5">in North America · Numerai</text>
    <text x="32" y="186" class="ink2" font-size="13.5">numerAIModel: 3 months live, 60% returns,</text><text x="32" y="205" class="ink2" font-size="13.5">era-based validation.</text>
  </g>
